<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeCaiman 🐊 | Portafolio</title>
<style>
  body { font-family: -apple-system, sans-serif; background:#f4f4f5; color:#111; padding:20px; transition:0.3s; max-width:600px; margin:auto; }
  .card { background:white; padding:24px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.1); margin-top:20px; }
  .dark-mode { background:#111 !important; color:#eee !important; }
  .dark-mode .card { background:#1e1e1e !important; color:#eee !important; }
  .btn { display:block; width:100%; padding:14px; border-radius:12px; border:0; font-weight:bold; text-align:center; text-decoration:none; margin-top:12px; cursor:pointer; }
  .btn-wa { background:#25D366; color:white; }
  .btn-dark { background:#111; color:white; }
  .dark-mode .btn-dark { background:#eee; color:#111; }
  .counter { text-align:center; margin-top:15px; font-size:14px; opacity:0.7; }
</style>
</head>
<body>

<div class="card">
  <h1>CodeCaiman 🐊</h1>
  <p>Desarrollador Web | De Actopan para el mundo.</p>
  <p>Portafolio V3 - Interactivo</p>
  
  <a id="btn-wa" class="btn btn-wa" href="https://wa.me/525664273569?text=Hola%20Caiman%20vi%20tu%20portafolio%20🐊" target="_blank">WhatsApp Directo</a>
  
  <button id="btn-dark" class="btn btn-dark">🌙 Modo Oscuro</button>
  
  <div class="counter">Has hecho <span id="count">0</span> clicks en mi portafolio</div>
</div>

<script>
  // DÍA 3 - JS
  let clicks = 0;
  const countSpan = document.getElementById('count');
  const btnDark = document.getElementById('btn-dark');
  const btnWa = document.getElementById('btn-wa');

  // Contador global
  document.body.addEventListener('click', () => {
    clicks++;
    countSpan.textContent = clicks;
  });

  // Modo oscuro
  btnDark.addEventListener('click', (e) => {
    e.stopPropagation();
    document.body.classList.toggle('dark-mode');
    btnDark.textContent = document.body.classList.contains('dark-mode') ? '☀️ Modo Claro' : '🌙 Modo Oscuro';
  });

  // Alerta personalizada WA
  btnWa.addEventListener('click', () => {
    setTimeout(()=> alert('Redirigiendo al WhatsApp de CodeCaiman 🐊'), 200);
  });
</script>

</body>
</html>
