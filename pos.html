<!DOCTYPE html>
<html>
<head>
<title>CAIMAN MICELANIA FINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:20px;max-width:500px;margin:auto}
.buscador{width:100%;padding:14px;border-radius:10px;border:2px solid #a855f7;background:#141414;color:#fff;font-size:16px;margin-bottom:15px;box-sizing:border-box}
.item{display:flex;justify-content:space-between;align-items:center;background:#141414;padding:12px;margin:8px 0;border-radius:10px;border-left:4px solid #a855f7}
.item.bajo{border-left:4px solid #ff1a4a; background:#1a0f0f;}
.badge-bajo{background:#ff1a4a;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;margin-left:8px;font-weight:900}
.total{font-size:18px;font-weight:900;color:#a855f7;margin-top:15px}
.vendido{font-size:18px;font-weight:900;color:#22c55e;background:#0f1a12;padding:12px;border-radius:10px;margin-top:15px;text-align:center;border:1px solid #22c55e}
.ticket{background:#fff;color:#000;padding:15px;border-radius:10px;margin-top:20px;font-family:monospace;font-size:14px}
.ticket-item{display:flex;justify-content:space-between;margin:5px 0;border-bottom:1px dotted #ccc;padding-bottom:3px}
.surtir{background:#1a0f0f;border:1px solid #ff1a4a;padding:12px;border-radius:10px;margin-top:15px;color:#ff8a8a;font-size:14px}
.historial{background:#141414;border:1px solid #3b82f6;padding:12px;border-radius:10px;margin-top:15px}
.estrella{background:#1a1a0f;border:1px solid #facc15;padding:12px;border-radius:10px;margin-top:15px;color:#facc15}
.export{background:#0f1a12;border:1px solid #22c55e;padding:12px;border-radius:10px;margin-top:15px}
.historial-item{display:flex;justify-content:space-between;margin:4px 0;font-size:14px}
input{padding:12px;border-radius:8px;border:2px solid #222;background:#141414;color:#fff;margin:5px;width:28%}
.btn-add{padding:12px;background:#a855f7;color:#fff;border:none;border-radius:10px;font-weight:900;width:100%;margin-top:10px}
.btn-print{padding:12px;background:#000;color:#fff;border:none;border-radius:8px;font-weight:900;width:100%;margin-top:15px;font-size:16px}
.btn-export{padding:10px;background:#22c55e;color:#000;border:none;border-radius:8px;font-weight:900;width:49%;margin-top:10px;font-size:13px}
.btn-vender{background:#22c55e;color:#000;border:none;padding:5px 10px;border-radius:6px;font-weight:900;margin-right:4px}
.btn-edit{background:#3b82f6;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-weight:900;margin-right:4px}
.btn-del{background:#ff1a4a;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-weight:900}
@media print {
  body *{visibility:hidden}
  #ticket, #ticket *{visibility:visible}
  #ticket{position:absolute;left:0;top:0;width:95%;background:#fff;color:#000;font-size:18px}
.btn-print{display:none}
}
</style>
</head>
<body>
<h1>MICELANIA CAIMAN🚀</h1>
<input type="text" id="buscador" class="buscador" placeholder="🔍 Buscar..." oninput="render()">
<input id="nombre" placeholder="Producto"><input id="precio" type="number" placeholder="$"><input id="stock" type="number" placeholder="Stock">
<button class="btn-add" onclick="agregar()">+ AGREGAR PRODUCTO</button>
<div id="lista" style="margin-top:20px"></div>
<div class="total">INVENTARIO: $<span id="total">0</span></div>
<div class="vendido">VENDIDO HOY: $<span id="vendido">0</span> <button onclick="cerrarCaja()" style="margin-left:10px;background:#fff;color:#000;border:none;padding:4px 8px;border-radius:5px;font-size:12px">CERRAR CAJA</button></div>
<div id="surtir" class="surtir"></div>
<div id="estrella" class="estrella"></div>

<div class="ticket" id="ticket">
<h3 style="margin:0 0 10px 0;text-align:center;border-bottom:2px dashed #000;padding-bottom:8px">🧾 TICKET - MISCELANEA CAIMAN<br><span id="fecha" style="font-size:11px"></span></h3>
<div id="ticket-lista"></div>
<div style="border-top:2px dashed #000;margin-top:10px;padding-top:8px;font-weight:900;display:flex;justify-content:space-between;font-size:16px"><span>TOTAL:</span><span id="ticket-total">$0</span></div>
<button class="btn-print" onclick="window.print()">🖨️ IMPRIMIR TICKET</button>
</div>

<div class="historial" id="historial">
<h3 style="margin:0 0 10px 0;color:#3b82f6">📊 HISTORIAL DE VENTAS</h3>
<div id="historial-lista"></div>
<div style="border-top:1px solid #3b82f6;margin-top:10px;padding-top:8px;font-weight:900;display:flex;justify-content:space-between;color:#3b82f6"><span>TOTAL HISTORIAL:</span><span id="historial-total">$0</span></div>
</div>

<div class="export">
<h3 style="margin:0 0 10px 0;color:#22c55e">📤 EXPORTAR PARA CONTADOR</h3>
<button class="btn-export" onclick="exportarInventario()">📦 INVENTARIO</button>
<button class="btn-export" onclick="exportarVentas()">💰 VENTAS</button>
<p style="font-size:11px;margin-top:8px;color:#8a8a8a">Se baja un.xls que abres en Excel y se lo mandas al contador por WhatsApp</p>
</div>

<script>
let productos = JSON.parse(localStorage.getItem('caiman_pos')) || [
  {nombre:"Sabritas", precio:20, stock:20},
  {nombre:"Coca 600ml", precio:20, stock:18},
  {nombre:"Galletas", precio:15, stock:3},
  {nombre:"CERVEZA", precio:20, stock:4},
  {nombre:"ACEITE", precio:35, stock:4}
];
let vendidoHoy = parseInt(localStorage.getItem('caiman_vendido')) || 0;
let ventas = JSON.parse(localStorage.getItem('caiman_ventas') || '[]');
let historial = JSON.parse(localStorage.getItem('caiman_historial') || '[]');

function guardar(){
  localStorage.setItem('caiman_pos', JSON.stringify(productos));
  localStorage.setItem('caiman_vendido', vendidoHoy);
  localStorage.setItem('caiman_ventas', JSON.stringify(ventas));
  localStorage.setItem('caiman_historial', JSON.stringify(historial));
}
function cerrarCaja(){
  if(ventas.length===0){ alert("No hay ventas hoy"); return; }
  if(confirm("¿Cerrar caja de $"+vendidoHoy+"? Se guardará en historial")){
    let fecha = new Date().toLocaleDateString();
    historial.push({fecha:fecha, total:vendidoHoy, ventas:[...ventas]});
    vendidoHoy=0; ventas=[]; guardar(); render();
  }
}

function exportarInventario(){
  let csv = "Producto,Precio,Stock,Valor Total,Estado\n";
  productos.forEach(p=>{
    let estado = p.stock<=4? "FALTA SURTIR" : "OK";
    csv+=`${p.nombre},${p.precio},${p.stock},${p.precio*p.stock},${estado}\n`;
  });
  csv+=`,,TOTAL:,${productos.reduce((a,b)=>a+b.precio*b.stock,0)},\n`;
  descargar(csv, "inventario_caiman_"+new Date().toLocaleDateString().replace(/\//g,"-")+".xls");
}
function exportarVentas(){
  let csv = "Fecha,Hora,Producto,Precio\n";
  historial.forEach(h=>{
    h.ventas.forEach(v=>{
      csv+=`${h.fecha},${v.hora},${v.nombre},${v.precio}\n`;
    });
    csv+=`${h.fecha},,CIERRE CAJA,${h.total}\n`;
  });
  ventas.forEach(v=>{
    csv+=`${new Date().toLocaleDateString()},${v.hora},${v.nombre},${v.precio}\n`;
  });
  csv+=`,,TOTAL HISTORIAL,${historial.reduce((a,b)=>a+b.total,0)+vendidoHoy}\n`;
  descargar(csv, "ventas_caiman_"+new Date().toLocaleDateString().replace(/\//g,"-")+".xls");
}
function descargar(contenido, nombre){
  let blob = new Blob(["\uFEFF"+contenido], {type: "text/csv;charset=utf-8;"});
  let url = URL.createObjectURL(blob);
  let a = document.createElement("a");
  a.href=url; a.download=nombre; a.click();
}

function render(){
  let filtro = document.getElementById('buscador').value.toLowerCase();
  let html=""; let total=0; let bajos=[];
  productos.forEach((p,i)=>{
    let v=p.precio*p.stock; total+=v;
    if(p.stock<=4) bajos.push(p.nombre+" x"+p.stock);
    if(p.nombre.toLowerCase().includes(filtro)){
      let claseBajo = p.stock <= 4? 'bajo' : '';
      let badge = p.stock <= 4? '<span class="badge-bajo">¡BAJO!</span>' : '';
      html+=`<div class="item ${claseBajo}"><span>${p.nombre} x${p.stock} ${badge}</span><span>$${v} <button class="btn-vender" onclick="vender(${i})">-1</button><button class="btn-edit" onclick="editar(${i})">✏️</button><button class="btn-del" onclick="borrar(${i})">X</button></span></div>`;
    }
  });
  document.getElementById('lista').innerHTML=html;
  document.getElementById('total').textContent=total;
  document.getElementById('vendido').textContent=vendidoHoy;
  document.getElementById('fecha').textContent = new Date().toLocaleString();
  document.getElementById('surtir').innerHTML = bajos.length>0? "🚨 FALTA SURTIR ("+bajos.length+"): "+bajos.join(", ") : "✅ Todo surtido";

  if(ventas.length===0){ document.getElementById('ticket-lista').innerHTML="Sin ventas..."; document.getElementById('ticket-total').textContent="$0"; }
  else {
    let tHtml=""; let tTotal=0;
    ventas.forEach(v=>{ tHtml+=`<div class="ticket-item"><span>${v.hora} - ${v.nombre}</span><span><b>$${v.precio}</b></span></div>`; tTotal+=v.precio; });
    document.getElementById('ticket-lista').innerHTML=tHtml;
    document.getElementById('ticket-total').textContent="$"+tTotal;
  }

  let conteo = {};
  historial.forEach(h=>{ h.ventas.forEach(v=>{ conteo[v.nombre] = (conteo[v.nombre]||0)+1; }); });
  ventas.forEach(v=>{ conteo[v.nombre] = (conteo[v.nombre]||0)+1; });
  let listaNombres = Object.keys(conteo);
  if(listaNombres.length>0){
    let ordenados = listaNombres.sort((a,b)=>conteo[b]-conteo[a]);
    document.getElementById('estrella').innerHTML = `⭐ ESTRELLA: <b>${ordenados[0]} (${conteo[ordenados[0]]})</b><br>🐢 MENOS: ${ordenados[ordenados.length-1]} (${conteo[ordenados[ordenados.length-1]]})`;
  } else {
    document.getElementById('estrella').innerHTML = "⭐ Vende algo para ver tu estrella";
  }

  if(historial.length===0){ document.getElementById('historial-lista').innerHTML="Aún no hay cierres..."; document.getElementById('historial-total').textContent="$0"; }
  else {
    let hHtml=""; let hTotal=0;
    historial.slice().reverse().forEach(h=>{ hHtml+=`<div class="historial-item"><span>${h.fecha}</span><span>$${h.total}</span></div>`; hTotal+=h.total; });
    document.getElementById('historial-lista').innerHTML=hHtml;
    document.getElementById('historial-total').textContent="$"+hTotal;
  }
  guardar();
}
function vender(i){
  if(productos[i].stock>0){
    let hora = new Date().getHours()+":"+String(new Date().getMinutes()).padStart(2,'0');
    ventas.push({nombre:productos[i].nombre, precio:productos[i].precio, hora:hora});
    vendidoHoy+=productos[i].precio; productos[i].stock--; render();
  }
}
function borrar(i){ if(confirm("¿Borrar?")){ productos.splice(i,1); render(); } }
function editar(i){
  let np = prompt("Nuevo precio:", productos[i].precio); if(np===null) return;
  let ns = prompt("Nuevo stock:", productos[i].stock); if(ns===null) return;
  productos[i].precio=parseInt(np); productos[i].stock=parseInt(ns); render();
}
function agregar(){
  let n=document.getElementById('nombre').value.trim();
  let pr=parseInt(document.getElementById('precio').value);
  let st=parseInt(document.getElementById('stock').value);
  if(!n ||!pr ||!st) return;
  productos.push({nombre:n, precio:pr, stock:st});
  document.getElementById('nombre').value=""; document.getElementById('precio').value=""; document.getElementById('stock').value="";
  render();
}
render();
</script>
</body>
</html>
