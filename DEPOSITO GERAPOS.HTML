<!DOCTYPE html>
<html>
<head>
<title>CAIMAN MICELANIA FIX PRINT</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:15px;max-width:700px;margin:auto}
.buscador{width:100%;padding:14px;border-radius:10px;border:2px solid #a855f7;background:#141414;color:#fff;font-size:16px;margin-bottom:15px;box-sizing:border-box}

/* CUADROS PEQUEÑOS */
#lista{display:grid;grid-template-columns:repeat(3, 1fr);gap:10px;}
@media(max-width:500px){#lista{grid-template-columns:repeat(2, 1fr);}}
.item{background:#141414;padding:10px;border-radius:16px;border:2px solid #222;text-align:center;position:relative;display:flex;flex-direction:column;align-items:center;min-height:170px;justify-content:space-between}
.item.bajo{border-color:#ff1a4a; background:#1a0f0f;}
.item img{width:75px;height:75px;object-fit:cover;border-radius:12px;border:2px solid #a855f7;}
.badge-bajo{background:#ff1a4a;color:#fff;padding:2px 5px;border-radius:5px;font-size:8px;font-weight:900;position:absolute;top:6px;right:6px}
.item-nombre{font-size:13px;font-weight:800;margin:6px 0 2px 0;line-height:1.1}
.item-stock{font-size:10px;color:#888}
.item-precio{font-size:15px;font-weight:900;color:#a855f7}
.btns{display:flex;gap:4px;margin-top:6px;}

.total{font-size:18px;font-weight:900;color:#a855f7;margin-top:15px}
.vendido{font-size:18px;font-weight:900;color:#22c55e;background:#0f1a12;padding:12px;border-radius:10px;margin-top:15px;text-align:center;border:1px solid #22c55e}
.ticket{background:#fff;color:#000;padding:15px;border-radius:10px;margin-top:20px;font-family:monospace;font-size:14px}
.ticket-item{display:flex;justify-content:space-between;margin:5px 0;border-bottom:1px dotted #ccc;padding-bottom:3px}
.surtir{background:#1a0f0f;border:1px solid #ff1a4a;padding:12px;border-radius:10px;margin-top:15px;color:#ff8a8a;font-size:14px}
.historial{background:#141414;border:1px solid #3b82f6;padding:12px;border-radius:10px;margin-top:15px}
.estrella{background:#1a1a0f;border:1px solid #facc15;padding:12px;border-radius:10px;margin-top:15px;color:#facc15}
.export{background:#0f1a12;border:1px solid #22c55e;padding:12px;border-radius:10px;margin-top:15px}
input{padding:12px;border-radius:8px;border:2px solid #222;background:#141414;color:#fff;margin:5px;width:28%}
.btn-add{padding:14px;background:#a855f7;color:#fff;border:none;border-radius:10px;font-weight:900;width:100%;margin-top:10px;font-size:16px}
.btn-print{padding:12px;background:#000;color:#fff;border:none;border-radius:8px;font-weight:900;width:100%;margin-top:15px;font-size:16px}
.btn-export{padding:10px;background:#22c55e;color:#000;border:none;border-radius:8px;font-weight:900;width:49%;margin-top:10px;font-size:13px}
.btn-vender{background:#22c55e;color:#000;border:none;padding:5px 8px;border-radius:7px;font-weight:900;font-size:11px}
.btn-edit{background:#3b82f6;color:#fff;border:none;padding:5px 7px;border-radius:7px;font-weight:900;font-size:11px}
.btn-del{background:#ff1a4a;color:#fff;border:none;padding:5px 7px;border-radius:7px;font-weight:900;font-size:11px}

/* === FIX DE IMPRESIÓN === */
@media print {
  body * { visibility: hidden; }
  #ticket, #ticket * { visibility: visible; }
  #ticket {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    margin: 0;
    padding: 10px;
    border: none;
    box-shadow: none;
  }
  #ticket.btn-print { display: none; }
}
</style>
</head>
<body>

<div id="pantallaLogin" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; z-index:9999; display:flex; align-items:center; justify-content:center;">
  <div style="background:white; padding:30px; border-radius:15px; text-align:center; width:90%; max-width:350px;">
    <h2 style="color:#000;">🐊 CAIMAN POS</h2>
    <input type="password" id="passInput" placeholder="Contraseña" style="width:100%; padding:12px; margin:15px 0; border:2px solid #e2e8f0; border-radius:8px; color:#000;">
    <button onclick="entrarCaiman()" style="width:100%; padding:12px; background:#22c55e; color:white; border:none; border-radius:8px; font-weight:bold;">ENTRAR</button>
    <p id="errorLogin" style="color:red; margin-top:10px; display:none;">Contraseña incorrecta</p>
    <p style="font-size:12px; color:#94a3b8; margin-top:10px;" id="tipPass"></p>
  </div>
</div>

<h1>MICELANIA CAIMAN🚀 <button onclick="salirCaiman()" style="background:#ff1a4a; color:white; border:none; padding:5px 10px; border-radius:5px; font-size:11px; float:right;">Salir</button></h1>
<input type="text" id="buscador" class="buscador" placeholder="🔍 Buscar..." oninput="render()">
<div style="display:flex; gap:5px;">
<input id="nombre" placeholder="Producto"><input id="precio" type="number" placeholder="$"><input id="stock" type="number" placeholder="Stock">
</div>
<button class="btn-add" onclick="agregar()">+ AGREGAR PRODUCTO</button>

<div id="lista" style="margin-top:20px"></div>
<div class="total">INVENTARIO: $<span id="total">0</span></div>
<div class="vendido">VENDIDO HOY: $<span id="vendido">0</span> <button onclick="cerrarCaja()" style="margin-left:10px;background:#fff;color:#000;border:none;padding:4px 8px;border-radius:5px;font-size:12px">CERRAR CAJA</button></div>
<div id="surtir" class="surtir"></div>
<div id="estrella" class="estrella"></div>

<div class="ticket" id="ticket">
<h3 style="margin:0 0 10px 0;text-align:center;border-bottom:2px dashed #000;padding-bottom:8px">🧾 TICKET CAIMAN<br><span id="fecha" style="font-size:11px"></span></h3>
<div id="ticket-lista"></div>
<div style="border-top:2px dashed #000;margin-top:10px;padding-top:8px;font-weight:900;display:flex;justify-content:space-between;font-size:16px"><span>TOTAL:</span><span id="ticket-total">$0</span></div>
<button class="btn-print" onclick="window.print()">🖨️ IMPRIMIR TICKET</button>
</div>

<div class="historial" id="historial"><h3 style="margin:0 0 10px 0;color:#3b82f6">📊 HISTORIAL</h3><div id="historial-lista"></div><div style="border-top:1px solid #3b82f6;margin-top:10px;padding-top:8px;font-weight:900;display:flex;justify-content:space-between;color:#3b82f6"><span>TOTAL:</span><span id="historial-total">$0</span></div></div>
<div class="export"><h3 style="margin:0 0 10px 0;color:#22c55e">📤 EXPORTAR</h3><button class="btn-export" onclick="exportarInventario()">📦 INVENTARIO</button><button class="btn-export" onclick="exportarVentas()">💰 VENTAS</button></div>

<script>
let productos = JSON.parse(localStorage.getItem('caiman_pos')) || [
{nombre:"Sabritas", precio:20, stock:20, foto:"https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=200"},
{nombre:"Coca 600ml", precio:20, stock:18, foto:"https://images.unsplash.com/photo-1553456558-aff63285bdd1?w=200"},
{nombre:"Galletas", precio:15, stock:3, foto:"https://via.placeholder.com/100/facc15/000?text=G"},
{nombre:"CERVEZA", precio:20, stock:4, foto:"https://via.placeholder.com/100/ff1a4a/fff?text=C"},
{nombre:"ACEITE", precio:35, stock:4, foto:"https://via.placeholder.com/100/a855f7/fff?text=A"}
];
let vendidoHoy = parseInt(localStorage.getItem('caiman_vendido')) || 0;
let ventas = JSON.parse(localStorage.getItem('caiman_ventas') || '[]');
let historial = JSON.parse(localStorage.getItem('caiman_historial') || '[]');
function guardar(){localStorage.setItem('caiman_pos', JSON.stringify(productos));localStorage.setItem('caiman_vendido', vendidoHoy);localStorage.setItem('caiman_ventas', JSON.stringify(ventas));localStorage.setItem('caiman_historial', JSON.stringify(historial));}
function cerrarCaja(){if(ventas.length===0){alert("No hay ventas");return;}if(confirm("¿Cerrar caja $"+vendidoHoy+"?")){historial.push({fecha:new Date().toLocaleDateString(), total:vendidoHoy, ventas:[...ventas]});vendidoHoy=0;ventas=[];guardar();render();}}
function exportarInventario(){let csv="Producto,Precio,Stock,Valor,Estado\n";productos.forEach(p=>{let e=p.stock<=4?"FALTA":"OK";csv+=`${p.nombre},${p.precio},${p.stock},${p.precio*p.stock},${e}\n`;});let blob=new Blob(["\uFEFF"+csv],{type:"text/csv"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="inventario.xls";a.click();}
function exportarVentas(){let csv="Fecha,Hora,Producto,Precio\n";historial.forEach(h=>{h.ventas.forEach(v=>{csv+=`${h.fecha},${v.hora},${v.nombre},${v.precio}\n`;});});let blob=new Blob(["\uFEFF"+csv],{type:"text/csv"});let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="ventas.xls";a.click();}
function render(){
let filtro=document.getElementById('buscador').value.toLowerCase();
let html="";let total=0;let bajos=[];
productos.forEach((p,i)=>{
let v=p.precio*p.stock;total+=v;
if(p.stock<=4)bajos.push(p.nombre+" x"+p.stock);
if(p.nombre.toLowerCase().includes(filtro)){
let c=p.stock<=4?'bajo':'';let b=p.stock<=4?'<span class="badge-bajo">¡BAJO!</span>':'';
let img = p.foto? `<img src="${p.foto}" onerror="this.src='https://via.placeholder.com/80'">` : '';
html+=`<div class="item ${c}">${b}${img}<div class="item-nombre">${p.nombre}</div><div class="item-stock">x${p.stock}</div><div class="item-precio">$${p.precio}</div><div class="btns"><button class="btn-vender" onclick="vender(${i})">-1</button><button class="btn-edit" onclick="editar(${i})">✏️</button><button class="btn-del" onclick="borrar(${i})">X</button></div></div>`;
}
});
document.getElementById('lista').innerHTML=html;
document.getElementById('total').textContent=total;
document.getElementById('vendido').textContent=vendidoHoy;
document.getElementById('fecha').textContent=new Date().toLocaleString();
document.getElementById('surtir').innerHTML=bajos.length>0?"🚨 FALTA: "+bajos.join(", "):"✅ Todo surtido";
if(ventas.length===0){document.getElementById('ticket-lista').innerHTML="Sin ventas...";document.getElementById('ticket-total').textContent="$0";}else{let tHtml="";let tTotal=0;ventas.forEach(v=>{tHtml+=`<div class="ticket-item"><span>${v.hora} - ${v.nombre}</span><span><b>$${v.precio}</b></span></div>`;tTotal+=v.precio;});document.getElementById('ticket-lista').innerHTML=tHtml;document.getElementById('ticket-total').textContent="$"+tTotal;}
let conteo={};historial.forEach(h=>{h.ventas.forEach(v=>{conteo[v.nombre]=(conteo[v.nombre]||0)+1;});});ventas.forEach(v=>{conteo[v.nombre]=(conteo[v.nombre]||0)+1;});let lista=Object.keys(conteo);if(lista.length>0){let o=lista.sort((a,b)=>conteo[b]-conteo[a]);document.getElementById('estrella').innerHTML=`⭐ ESTRELLA: <b>${o[0]} (${conteo[o[0]]})</b><br>🐢 MENOS: ${o[o.length-1]}`;}else{document.getElementById('estrella').innerHTML="⭐ Vende algo";}
if(historial.length===0){document.getElementById('historial-lista').innerHTML="Aún no hay cierres...";document.getElementById('historial-total').textContent="$0";}else{let hHtml="";let hTotal=0;historial.slice().reverse().forEach(h=>{hHtml+=`<div class="historial-item"><span>${h.fecha}</span><span>$${h.total}</span></div>`;hTotal+=h.total;});document.getElementById('historial-lista').innerHTML=hHtml;document.getElementById('historial-total').textContent="$"+hTotal;}
guardar();
}
function vender(i){if(productos[i].stock>0){let hora=new Date().getHours()+":"+String(new Date().getMinutes()).padStart(2,'0');ventas.push({nombre:productos[i].nombre, precio:productos[i].precio, hora:hora});vendidoHoy+=productos[i].precio;productos[i].stock--;render();}}
function borrar(i){if(confirm("¿Borrar?")){productos.splice(i,1);render();}}
function editar(i){let np=prompt("Nuevo precio:",productos[i].precio);if(np===null)return;let ns=prompt("Nuevo stock:",productos[i].stock);if(ns===null)return;productos[i].precio=parseInt(np);productos[i].stock=parseInt(ns);render();}
function agregar(){let n=document.getElementById('nombre').value.trim();let pr=parseInt(document.getElementById('precio').value);let st=parseInt(document.getElementById('stock').value);if(!n||!pr||!st)return;let foto="https://via.placeholder.com/100/a855f7/fff?text="+n[0].toUpperCase();productos.push({nombre:n, precio:pr, stock:st, foto:foto});document.getElementById('nombre').value="";document.getElementById('precio').value="";document.getElementById('stock').value="";render();}
function getPassActual(){return localStorage.getItem('caimanPass') || 'caiman2026';}
function entrarCaiman(){let pass=document.getElementById('passInput').value.trim();if(pass===getPassActual()){localStorage.setItem('caimanLogueado','si');document.getElementById('pantallaLogin').style.display='none';}else{document.getElementById('errorLogin').style.display='block';}}
function salirCaiman(){localStorage.removeItem('caimanLogueado');location.reload();}
if(localStorage.getItem('caimanLogueado')==='si'){document.getElementById('pantallaLogin').style.display='none';}
document.getElementById('tipPass').textContent="Actual: "+getPassActual();
render();
</script>
</body>
</html>
