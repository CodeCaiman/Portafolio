<!DOCTYPE html>
<html>
<head>
<title>CAIMAN FINAL LIMPIO</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{background:#0a0a0a;color:#fff;font-family:sans-serif;padding:20px;max-width:500px;margin:auto}
.buscador{width:100%;padding:14px;border-radius:10px;border:2px solid #a855f7;background:#141414;color:#fff;font-size:16px;margin-bottom:15px;box-sizing:border-box}
.item{display:flex;justify-content:space-between;align-items:center;background:#141414;padding:12px;margin:8px 0;border-radius:10px;border-left:4px solid #a855f7}
.item.bajo{border-left:4px solid #ff1a4a; background:#1a0f0f;}
.badge-bajo{background:#ff1a4a;color:#fff;padding:2px 6px;border-radius:4px;font-size:10px;margin-left:8px;font-weight:900}
.total{font-size:18px;font-weight:900;color:#a855f7;margin-top:15px}
.vendido{font-size:18px;font-weight:900;color:#22c55e;background:#0f1a12;padding:12px;border-radius:10px;margin-top:15px;text-align:center;border:1px solid #22c55e}
.ticket{background:#fff;color:#000;padding:15px;border-radius:10px;margin-top:20px;font-family:monospace;font-size:14px}
.historial{background:#141414;border:1px solid #3b82f6;padding:12px;border-radius:10px;margin-top:15px}
.estrella{background:#1a1a0f;border:1px solid #facc15;padding:12px;border-radius:10px;margin-top:15px;color:#facc15}
.export{background:#0f1a12;border:1px solid #22c55e;padding:12px;border-radius:10px;margin-top:15px}
input{padding:12px;border-radius:8px;border:2px solid #222;background:#141414;color:#fff;margin:5px;width:28%}
.btn-add{padding:14px;background:#a855f7;color:#fff;border:none;border-radius:10px;font-weight:900;width:100%;margin-top:10px;font-size:16px}
.btn-vender{background:#22c55e;color:#000;border:none;padding:6px 12px;border-radius:6px;font-weight:900;margin-right:4px}
.btn-edit{background:#3b82f6;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-weight:900;margin-right:4px}
.btn-del{background:#ff1a4a;color:#fff;border:none;padding:6px 10px;border-radius:6px;font-weight:900}
</style>
</head>
<body>
<h1>MICELANIA CAIMAN🚀</h1>
<input type="text" id="buscador" class="buscador" placeholder="🔍 Buscar producto..." oninput="render()">
<div style="display:flex; gap:5px;">
<input id="nombre" placeholder="Producto"><input id="precio" type="number" placeholder="$"><input id="stock" type="number" placeholder="Stock">
</div>
<input type="file" id="fotoFile" accept="image/*" style="width:100%;margin-top:10px;background:#141414;padding:10px;box-sizing:border-box;">
<button class="btn-add" onclick="agregar()">+ AGREGAR PRODUCTO</button>
<div id="lista" style="margin-top:20px"></div>
<div class="total">INVENTARIO: $<span id="total">0</span></div>
<div class="vendido">VENDIDO HOY: $<span id="vendido">0</span></div>
<script>
let productos = JSON.parse(localStorage.getItem('caiman_pos_final')) || [
{nombre:"Sabritas", precio:20, stock:20, foto:"https://images.unsplash.com/photo-1566478989037-eec170784d0b?w=100"},
{nombre:"Coca 600ml", precio:20, stock:18, foto:"https://images.unsplash.com/photo-1553456558-aff63285bdd1?w=100"},
{nombre:"Galletas", precio:15, stock:3, foto:"https://via.placeholder.com/60/facc15/000?text=G"},
{nombre:"CERVEZA", precio:20, stock:4, foto:"https://via.placeholder.com/60/ff1a4a/fff?text=C"},
{nombre:"ACEITE", precio:35, stock:4, foto:"https://via.placeholder.com/60/a855f7/fff?text=A"}
];
let vendidoHoy = 0;
function guardar(){localStorage.setItem('caiman_pos_final', JSON.stringify(productos));}
function render(){let filtro=document.getElementById('buscador').value.toLowerCase();let html="";let total=0;productos.forEach((p,i)=>{let v=p.precio*p.stock;total+=v;if(p.nombre.toLowerCase().includes(filtro)){let c=p.stock<=4?'bajo':'';let b=p.stock<=4?'<span class="badge-bajo">¡BAJO!</span>':'';let img = p.foto? `<img src="${p.foto}" style="width:50px;height:50px;object-fit:cover;border-radius:10px;margin-right:10px;border:2px solid #a855f7">` : '';html+=`<div class="item ${c}"><span style="display:flex;align-items:center;">${img}${p.nombre} x${p.stock} ${b}</span><span>$${v} <button class="btn-vender" onclick="vender(${i})">-1</button><button class="btn-edit" onclick="editar(${i})">✏️</button><button class="btn-del" onclick="borrar(${i})">X</button></span></div>`;}});document.getElementById('lista').innerHTML=html;document.getElementById('total').textContent=total;guardar();}
function vender(i){if(productos[i].stock>0){productos[i].stock--;render();}}
function borrar(i){if(confirm("¿Borrar?")){productos.splice(i,1);render();}}
function editar(i){let np=prompt("Nuevo precio:",productos[i].precio);if(np===null)return;productos[i].precio=parseInt(np);render();}
function agregar(){let n=document.getElementById('nombre').value.trim();let pr=parseInt(document.getElementById('precio').value);let st=parseInt(document.getElementById('stock').value);let file=document.getElementById('fotoFile').files[0];if(!n||!pr||!st)return;let fotoUrl="https://via.placeholder.com/60/a855f7/fff?text="+n[0].toUpperCase();if(file){let reader=new FileReader();reader.onload=function(e){fotoUrl=e.target.result;productos.push({nombre:n, precio:pr, stock:st, foto:fotoUrl});document.getElementById('nombre').value="";document.getElementById('precio').value="";document.getElementById('stock').value="";document.getElementById('fotoFile').value="";render();};reader.readAsDataURL(file);}else{productos.push({nombre:n, precio:pr, stock:st, foto:fotoUrl});document.getElementById('nombre').value="";document.getElementById('precio').value="";document.getElementById('stock').value="";document.getElementById('fotoFile').value="";render();}}
render();
</script>
</body>
</html>
